[project]
name = "aig_ethiopian_calendar"
version = "0.1.0"
description = "Ethiopian Calendar UI and conversion layer for ERPNext/Frappe v16 - presentation only, Gregorian canonical"
authors = [{ name = "AIG" }]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["aig_ethiopian_calendar/tests"]
