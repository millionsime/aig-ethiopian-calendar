name: Trigger server deploy
# The server image bakes this app in, so a change on main must rebuild and
# redeploy it. Same mechanism as aig-erp-theme. Needs the repo secret
# INFRA_DISPATCH_TOKEN (fine-grained token on millionsime/aig-erpnext-infra,
# Actions: read and write). Without it the job warns and does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::INFRA_DISPATCH_TOKEN is not set; start the deploy from the aig-erpnext-infra Actions tab"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/millionsime/aig-erpnext-infra/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Deploy requested: https://github.com/millionsime/aig-erpnext-infra/actions"
